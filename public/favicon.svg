<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Saffron Rounded Container -->
  <rect width="100" height="100" rx="22" fill="url(#saffronGrad)" stroke="#FFD54F" stroke-width="3"/>
  <!-- Golden Aura Ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FFF9C4" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Glowing Om (ॐ) with extensive font fallbacks -->
  <text y="71" x="50" text-anchor="middle" font-size="64" font-weight="bold" fill="#FFFFFF" filter="url(#glow)" font-family="'Nirmala UI', 'Mangal', 'Devanagari MT', 'Kokila', 'Aparajita', 'Noto Sans Devanagari', 'Segoe UI Historic', 'Arial Unicode MS', sans-serif">ॐ</text>
</svg>